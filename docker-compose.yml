services:
  backend:
    build:
      context: ./car_rental_backend
    container_name: boomboom-backend
    ports:
      - "8000:8000"
    env_file:
      - ./car_rental_backend/.env
    volumes:
      - ./car_rental_backend:/app
    restart: always

  frontend:
    build:
      context: ./car-rental-frontend
    container_name: boomboom-frontend
    ports:
      - "80:80"  # ✅ This allows access via http://13.48.42.165
    restart: always
